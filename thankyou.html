<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obrigado pela Sua Compra!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-slide-in { animation: slideIn 0.6s ease-out; }
        .animate-spin-slow { animation: spin-slow 2s linear infinite; }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-100 to-gray-50">
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        // CONFIG PADRÃO
        const DEFAULT_CONFIG = {
            conversionId: 'AW-123456789',
            conversionLabel: 'AbC123DeFg_K',
            redirectUrl: 'https://seusite.com/produto',
            purchaseValue: '99.90',
            currency: 'BRL',
            companyName: 'Sua Empresa',
            delayRedirect: 3000,
            avatarText: 'Processando sua compra...',
            avatarImage: null,
        };

        function ThankYouPage() {
            const [progress, setProgress] = React.useState(0);
            const [avatarUrl, setAvatarUrl] = React.useState('');
            const [config, setConfig] = React.useState(DEFAULT_CONFIG);
            const fileInputRef = React.useRef(null);

            React.useEffect(() => {
                if (config.avatarImage) {
                    setAvatarUrl(config.avatarImage);
                }
            }, [config]);

            React.useEffect(() => {
                // Carrega configurações da API
                fetch('/api/config')
                    .then(res => res.json())
                    .then(data => {
                        setConfig(data);
                        activatePixelWithConfig(data);
                    })
                    .catch(err => {
                        console.error('Erro ao carregar config:', err);
                        activatePixelWithConfig(DEFAULT_CONFIG);
                    });

                // Simula progresso
                const progressInterval = setInterval(() => {
                    setProgress(prev => {
                        if (prev >= 100) {
                            clearInterval(progressInterval);
                            return 100;
                        }
                        return prev + Math.random() * 30;
                    });
                }, 300);

                // Redireciona após delay
                const redirectTimeout = setTimeout(() => {
                    setTimeout(() => {
                        fetch('/api/config')
                            .then(res => res.json())
                            .then(data => window.location.href = data.redirectUrl)
                            .catch(() => window.location.href = DEFAULT_CONFIG.redirectUrl);
                    }, 500);
                }, DEFAULT_CONFIG.delayRedirect);

                return () => {
                    clearInterval(progressInterval);
                    clearTimeout(redirectTimeout);
                };
            }, []);

            const activatePixelWithConfig = (currentConfig) => {
                const urlParams = new URLSearchParams(window.location.search);
                const priceFromUrl = urlParams.get('price') || currentConfig.purchaseValue;

                const script = document.createElement('script');
                script.async = true;
                script.src = `https://www.googleadservices.com/pagead/conversion/${currentConfig.conversionId.replace('AW-', '')}/`;
                document.head.appendChild(script);

                window.dataLayer = window.dataLayer || [];
                function gtag(){dataLayer.push(arguments);}
                gtag('js', new Date());

                gtag('event', 'purchase', {
                    'value': parseFloat(priceFromUrl),
                    'currency': currentConfig.currency,
                    'transaction_id': 'tx-' + Date.now(),
                    'send_to': `${currentConfig.conversionId}/${currentConfig.conversionLabel}`
                });

                console.log('✅ Pixel Google Ads Ativado:', {
                    conversionId: currentConfig.conversionId,
                    conversionLabel: currentConfig.conversionLabel,
                    value: priceFromUrl,
                    currency: currentConfig.currency,
                    timestamp: new Date().toISOString()
                });
            };

            const handleAvatarClick = () => {
                fileInputRef.current?.click();
            };

            const handleFileChange = (e) => {
                const file = e.target.files?.[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        setAvatarUrl(event.target?.result || '');
                    };
                    reader.readAsDataURL(file);
                }
            };

            return (
                <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-100 to-gray-50">
                    <div class="text-center">
                        {/* Avatar */}
                        <div class="mb-12">
                            <div
                                onClick={handleAvatarClick}
                                class="w-40 h-40 mx-auto relative cursor-pointer group"
                            >
                                {avatarUrl ? (
                                    <img
                                        src={avatarUrl}
                                        alt="Avatar"
                                        class="w-full h-full rounded-full object-cover border-4 border-gray-200 shadow-xl group-hover:shadow-2xl transition-all"
                                    />
                                ) : (
                                    <div class="w-full h-full rounded-full bg-gray-300 flex items-center justify-center border-4 border-gray-200 shadow-xl group-hover:shadow-2xl transition-all">
                                        <svg class="w-20 h-20 text-gray-500" fill="currentColor" viewBox="0 0 24 24">
                                            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                                        </svg>
                                    </div>
                                )}
                                <div class="absolute inset-0 rounded-full bg-black bg-opacity-0 group-hover:bg-opacity-20 transition-all flex items-center justify-center">
                                    <svg class="w-8 h-8 text-white opacity-0 group-hover:opacity-100 transition-opacity" fill="currentColor" viewBox="0 0 24 24">
                                        <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
                                    </svg>
                                </div>
                            </div>
                            <p class="text-sm text-gray-600 mt-3">{config.avatarText}</p>
                            <input
                                ref={fileInputRef}
                                type="file"
                                accept="image/*"
                                onChange={handleFileChange}
                                class="hidden"
                            />
                        </div>

                        {/* Progress Bar */}
                        <div class="w-80">
                            <div class="flex justify-center mb-3">
                                <span class="text-sm font-semibold text-gray-700">{Math.round(progress)}%</span>
                            </div>
                            <div class="w-full bg-gray-300 rounded-full h-3 overflow-hidden shadow">
                                <div
                                    class="bg-gradient-to-r from-blue-500 to-purple-500 h-full rounded-full transition-all duration-300"
                                    style={{ width: `${Math.min(progress, 100)}%` }}
                                ></div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<ThankYouPage />, document.getElementById('root'));
    </script>
</body>
</html>
